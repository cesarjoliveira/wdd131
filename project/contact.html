<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Alecrim Children's Orphanage</title>
    <link rel="stylesheet" href="styles/contact.css">
    <script defer src="scripts/script.js"></script>
</head>
<body>
    <header>
        <div class="logo">Alecrim Children's Orphanage</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-intro">
            <h1>Contact Us</h1>
            <p>If you have any questions, comments, or would like to learn more about our organization, please fill out the form below.</p>
        </section>

        <section class="contact-form">
            <form id="contactForm" action="javascript:void(0);" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Alecrim Children's Orphanage - last Modification: <span id="lastModified"></span></p>
        <p>Your visit count: <span id="visit-count"></span></p>
    </footer>
</body>
</html>
