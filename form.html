<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is a form of a review for products a activity suggested at WDD 131 - Dynamic Web Fundamentals course implementation created by Cesar Oliveira">
    <meta name="author" content="Cesar Oliveira">
    <title>Product Review Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/form.js"></script>
    <script defer src="scripts/getdates.js"></script>
</head>
<body>
    <div class="form-container">
        <h1>Product Review</h1>
        <form method="get" action="review.html" id="reviewForm">
            <div>
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>
    
            <div>
                <label>Overall Rating</label>
                <div class="rating">
                    <div class="rating-stars">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">☆</label>
                        <input type="radio" id="rating2" name="rating" value="2">
                        <label for="rating2">☆☆</label>
                        <input type="radio" id="rating3" name="rating" value="3">
                        <label for="rating3">☆☆☆</label>
                        <input type="radio" id="rating4" name="rating" value="4">
                        <label for="rating4">☆☆☆☆</label>
                        <input type="radio" id="rating5" name="rating" value="5">
                        <label for="rating5">☆☆☆☆☆</label>
                    </div>
                </div>
            </div>
    
            <div>
                <label for="installationDate">Date of Installation</label>
                <input type="date" id="installationDate" name="installationDate" required>
            </div>
    
            <div>
                <label>Which features did you find useful in the product? <br>(Check all that apply)</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="feature1" name="usefulFeatures" value="Durability">
                    <label for="feature1">Durability</label>
                    <input type="checkbox" id="feature2" name="usefulFeatures" value="Ease of Use">
                    <label for="feature2">Ease of Use</label>
                    <input type="checkbox" id="feature3" name="usefulFeatures" value="Performance">
                    <label for="feature3">Performance</label>
                    <input type="checkbox" id="feature4" name="usefulFeatures" value="Design">
                    <label for="feature4">Design</label>
                </div>
            </div>
    
            <div>
                <label for="writtenReview">Written Review <span>(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview"></textarea>
            </div>
    
            <div>
                <label for="userName">Your Name <span>(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>
    
            <div>
                <input type="submit" value="Post Review">
            </div>
        </form>
    </div>
    <footer>
    <p>©<span id="currentyear"></span> Cesar Oliveira - Brazil </p>
    <p> last Modification: <span id="lastModified"></span></p>
</footer>
</body>
</html>
